name: registry
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    permissions:
      contents: read
    services:
      registry:
        image: registry:3.1.1
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Docker CLI
        run: |
          apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
          apt update
          apt install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt update
          apt install -y docker-ce-cli

      - name: Verify Docker installation
        run: |
          ls -la /run/docker.sock 2>/dev/null || echo "/run/docker.sock not found"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info

      - name: Check registry hostname IP
        run: |
          echo "=== getent hosts registry ==="
          getent hosts registry || echo "getent not available"
          echo "=== nslookup registry ==="
          nslookup registry 2>/dev/null || echo "nslookup not available"
          echo "=== ping registry ==="
          ping -c 1 registry 2>/dev/null || echo "ping not available"
          echo "=== /etc/hosts ==="
          cat /etc/hosts

      - name: Resolve host IP
        run: |
          ip=$(getent hosts registry | awk '{print $1}')
          echo "ip=$ip"
          echo "ip=$ip" >> $GITHUB_ENV

      - name: Allow insecure Docker registry
        run: |
          docker info
          docker run --rm --privileged --pid=host \
            -v /etc/docker:/etc/docker \
            alpine:3.22 \
            sh -c "
              mkdir -p /etc/docker
              echo '{\"insecure-registries\":[\"${{ env.ip }}:5000\"]}' > /etc/docker/daemon.json
              kill -HUP \$(pgrep dockerd) 2>/dev/null || true
            "
          docker info

      - name: Build and push to local registry
        run: |
          docker build -t ${{ env.ip }}:5000/registry-example:${{ github.run_number }} .
          docker push ${{ env.ip }}:5000/registry-example:${{ github.run_number }}

      - name: Build and push with docker buildx
        run: |
          mkdir -p /etc/buildkit
          cat > /etc/buildkit/buildkitd.toml <<EOF
          [registry."${{ env.ip }}:5000"]
            http = true
            insecure = true
          EOF
          docker buildx create --use --driver docker-container --driver-opt "network=host" --buildkitd-flags '--allow-insecure-entitlement network.host' --buildkitd-config /etc/buildkit/buildkitd.toml
          docker buildx build \
            --tag ${{ env.ip }}:5000/registry-example:${{ github.run_number }}-buildx \
            --push \
            .

      - name: Verify image
        run: docker pull ${{ env.ip }}:5000/registry-example:${{ github.run_number }}
